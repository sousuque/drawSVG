<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SVGお絵かき</title>
<style>
:root{--bg:#f3f4f6;--panel:#fff;--line:#d9dce1;--text:#1f2937;--muted:#6b7280;--accent:#2563eb;--accent-weak:#dbeafe;--canvasbg:#d1d5db;--btn:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#1b1d21;--panel:#25282d;--line:#3a3e45;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--accent-weak:#1e3a5f;--canvasbg:#14161a;--btn:#31353c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{font:14px/1.4 system-ui,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:5px 10px;min-height:32px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
header{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
header h1{font-size:15px;margin:0 6px 0 2px}
main{flex:1;display:flex;min-height:0;position:relative}
#tools{width:68px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:8px 6px;overflow:auto}
#tools button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:6px 2px;border-radius:10px;background:transparent;border:1px solid transparent}
#tools button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
#tools svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#vp{flex:1;position:relative;overflow:hidden;background:var(--canvasbg);touch-action:none;cursor:crosshair;min-width:0}
#vp svg{display:block;width:100%;height:100%}
#cursor{position:absolute;left:0;top:0;border-radius:50%;border:1px solid #000;box-shadow:0 0 0 1px #fff;pointer-events:none;display:none}
#panel{width:288px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;touch-action:pan-y;padding:8px 12px 24px}
#panel section{padding:10px 0;border-bottom:1px solid var(--line)}
#panel h3{font-size:12px;margin:0 0 6px;color:var(--muted);font-weight:600;letter-spacing:.04em}
#panel section[hidden]{display:none}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
input[type=range]{flex:1;min-width:0}
input[type=number],input[type=text],select{background:var(--btn);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px}
input[type=number]{width:76px}
input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:6px;background:none}
.sw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sw i{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.chips button{padding:2px 7px;min-height:26px;font-size:12px}
#prev{height:104px;border:1px dashed var(--line);border-radius:8px;margin-top:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#8881 0 25%,#0000 0 50%) 0 0/16px 16px}
#prev i{display:block;border-radius:50%;background:#000;flex:none}
.small{font-size:12px;color:var(--muted)}
.layer{display:flex;align-items:center;gap:4px;padding:3px 4px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px;background:var(--btn)}
.layer.active{border-color:var(--accent);background:var(--accent-weak)}
.layer .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 2px}
.layer input{flex:1;min-width:0}
.ib{background:none;border:0;padding:4px;display:flex;border-radius:6px}
.ib:hover{background:#8883}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbtns{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.lbtns .btn{padding:3px 8px;min-height:28px;font-size:12px}
#status{display:flex;gap:14px;padding:3px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#111c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#busy{position:fixed;inset:0;background:#0004;display:none;align-items:center;justify-content:center;z-index:60;color:#fff;font-size:16px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:18px 20px;width:min(440px,92vw)}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 12px;font-size:17px}
dialog label{display:flex;gap:8px;align-items:center;margin:6px 0}
dialog fieldset{border:1px solid var(--line);border-radius:10px;margin:10px 0;padding:6px 12px 8px}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
#sInfo{font-size:13px;margin-top:8px;min-height:36px;color:var(--muted)}
#panelBtn{display:none}
@media (max-width:860px){
  #panelBtn{display:inline-block}
  #panel{position:absolute;right:0;top:0;bottom:0;z-index:10;box-shadow:-4px 0 16px #0004;transform:translateX(100%);transition:transform .2s}
  body.panel-open #panel{transform:none}
}
</style>
</head>
<body>
<header>
  <h1>SVGお絵かき</h1>
  <button class="btn" id="bNew">新規</button>
  <button class="btn primary" id="bSave">保存</button>
  <button class="btn" id="bCanvas">キャンバス設定</button>
  <span class="sep"></span>
  <button class="btn" id="bUndo" title="元に戻す (Ctrl+Z)">↶ 戻す</button>
  <button class="btn" id="bRedo" title="やり直し (Ctrl+Y)">↷ 進む</button>
  <span class="sep"></span>
  <button class="btn" id="bZout" title="縮小">－</button>
  <button class="btn" id="bZoom" title="100%に戻す" style="min-width:64px">100%</button>
  <button class="btn" id="bZin" title="拡大">＋</button>
  <button class="btn" id="bFit">全体表示</button>
  <span class="sep"></span>
  <button class="btn on" id="bPalm" title="ONの間は指では描かず、ペンとマウスだけが描画します。指は2本でズーム／移動に使えます">パームリジェクション: ON</button>
  <button class="btn" id="panelBtn">パネル</button>
</header>
<main>
  <nav id="tools">
    <button data-tool="pen" title="ペン (B)"><svg viewBox="0 0 24 24"><path d="M3 21l3.5-1L19 7.5a2.1 2.1 0 00-3-3L3.5 17 3 21z"/><path d="M14 6.5l3 3"/></svg>ペン</button>
    <button data-tool="eraser" title="消しゴム (E)"><svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H6l-3-3a1.5 1.5 0 010-2L16 3z"/><path d="M8 21h13"/></svg>消しゴム</button>
    <button data-tool="fill" title="塗りつぶし (G)"><svg viewBox="0 0 24 24"><path d="M5 11l6-6 8 8-6 6a2 2 0 01-2.8 0L5 13.8a2 2 0 010-2.8z"/><path d="M11 5L9.5 3"/><path d="M20 16c1 1.5 1.5 2.5 1.5 3.5a1.5 1.5 0 01-3 0c0-1 .5-2 1.5-3.5z"/></svg>塗りつぶし</button>
    <button data-tool="lasso" title="なげなわ選択 (L)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="8" ry="5" stroke-dasharray="3 2.5"/><path d="M8 13.5c-1 2 0 3.5 2 4s3 1 3 2.5"/></svg>なげなわ</button>
    <button data-tool="hand" title="移動 (H / Space)"><svg viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 013 0V11M11 11V4a1.5 1.5 0 013 0v7M14 11V5.5a1.5 1.5 0 013 0V13M17 9.5a1.5 1.5 0 013 0V15a7 7 0 01-7 7h-1a7 7 0 01-5.5-2.6L4 15a1.5 1.5 0 012.2-2L8 14.5"/></svg>手のひら</button>
  </nav>
  <div id="vp"><div id="cursor"></div></div>
  <aside id="panel">
    <section>
      <h3>色</h3>
      <div class="row"><input type="color" id="color" value="#1a1a1a"><span class="small" id="colorHex">#1a1a1a</span></div>
      <div class="sw" id="swatches"></div>
    </section>
    <section class="opt" data-for="pen eraser">
      <h3 id="sizeTitle">ペンの太さ (0.1〜100 px)</h3>
      <div class="row"><input type="range" id="sizeRange" min="0" max="1000" step="1"><input type="number" id="sizeNum" min="0.1" max="100" step="0.1"></div>
      <div class="chips" id="sizeChips"></div>
      <div id="prev"><i id="prevDot"></i></div>
    </section>
    <section class="opt" data-for="pen fill">
      <h3>不透明度</h3>
      <div class="row"><input type="range" id="opRange" min="1" max="100" value="100"><span class="small" id="opVal">100%</span></div>
    </section>
    <section class="opt" data-for="pen">
      <h3>手ぶれ補正</h3>
      <div class="row"><input type="range" id="smRange" min="0" max="100" value="20"><span class="small" id="smVal">20</span></div>
    </section>
    <section class="opt" data-for="fill">
      <h3>塗りつぶし設定</h3>
      <div class="row"><span class="small" style="width:56px">許容値</span><input type="range" id="tolRange" min="0" max="160" value="32"><span class="small" id="tolVal">32</span></div>
      <div class="row" style="margin-top:6px"><span class="small" style="width:56px">参照</span>
        <select id="fillRef"><option value="all">表示中の全レイヤー</option><option value="cur">現在のレイヤーのみ</option></select></div>
      <p class="small" style="margin:6px 0 0">線で囲まれた領域をクリックすると、ベクターの図形として塗りつぶします。</p>
    </section>
    <section class="opt" data-for="lasso">
      <h3>なげなわ選択</h3>
      <label class="row small"><input type="checkbox" id="lassoAll"> 全レイヤーから選択</label>
      <div class="small" id="selInfo" style="margin:6px 0">囲んで選択 → ドラッグで移動、右下の○で拡大縮小</div>
      <div class="row">
        <button class="btn" id="bSelDel" disabled>削除</button>
        <button class="btn" id="bSelDup" disabled>複製</button>
        <button class="btn" id="bSelClr" disabled>選択解除</button>
      </div>
    </section>
    <section>
      <h3>レイヤー</h3>
      <div id="layerList"></div>
      <div class="row" style="margin-top:6px"><span class="small">不透明度</span><input type="range" id="layerOpacity" min="0" max="100" value="100"><span class="small" id="layerOpVal">100%</span></div>
      <div class="lbtns">
        <button class="btn" id="lAdd">＋追加</button>
        <button class="btn" id="lDup">複製</button>
        <button class="btn" id="lDel">削除</button>
        <button class="btn" id="lUp">↑上へ</button>
        <button class="btn" id="lDown">↓下へ</button>
        <button class="btn" id="lMerge">下と結合</button>
      </div>
    </section>
    <section>
      <h3>操作ヒント</h3>
      <div class="small">2本指: ズーム＆移動 / ホイール: ズーム / Shift+ホイール・Space+ドラッグ・中ボタン: 移動 / ペンの消しゴム端も使えます / [ ]: 太さ変更</div>
    </section>
  </aside>
</main>
<div id="status"><span id="stPos">x: -, y: -</span><span id="stTool"></span><span id="stPalm"></span></div>
<div id="toast"></div>
<div id="busy"><span id="busyMsg">処理中…</span></div>

<dialog id="dlgSave">
  <h2>保存</h2>
  <label>形式
    <select id="sFormat"><option value="svg">SVG（ベクター）</option><option value="png">PNG</option><option value="jpeg">JPEG</option></select>
  </label>
  <fieldset>
    <legend>サイズ</legend>
    <label><input type="radio" name="sMode" value="orig" checked> そのままのサイズで保存</label>
    <label><input type="radio" name="sMode" value="comp"> 指定した容量まで圧縮して保存</label>
    <div class="row" id="targetRow" style="margin-left:24px">上限 <input type="number" id="sTarget" min="1" step="any" value="500"> <select id="sUnit"><option value="1024">KB</option><option value="1048576">MB</option></select></div>
  </fieldset>
  <label id="hidRow"><input type="checkbox" id="sHidden"> 非表示レイヤーも含める（SVGのみ）</label>
  <label><input type="checkbox" id="sTrans"> 背景を透明にする</label>
  <label id="gzRow"><input type="checkbox" id="sGz"> gzip圧縮する (.svgz)</label>
  <label>ファイル名 <input type="text" id="sName" value="drawing" style="flex:1"></label>
  <div id="sInfo"></div>
  <div class="actions"><button class="btn" id="sClose">閉じる</button><button class="btn primary" id="sGo">保存</button></div>
</dialog>

<dialog id="dlgCanvas">
  <h2>キャンバス設定</h2>
  <label>幅 <input type="number" id="cW" min="100" max="8000"> px</label>
  <label>高さ <input type="number" id="cH" min="100" max="8000"> px</label>
  <label>背景色 <input type="color" id="cBg"></label>
  <label><input type="checkbox" id="cTrans"> 背景を透明にする</label>
  <div class="actions"><button class="btn" id="cCancel">キャンセル</button><button class="btn primary" id="cOk">適用</button></div>
</dialog>

<script>
(() => {
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (v, p = 2) => { let s = (+v).toFixed(p); if (s.indexOf('.') >= 0) s = s.replace(/\.?0+$/, ''); return (s === '-0' || s === '') ? '0' : s; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tick = () => new Promise(r => setTimeout(r, 0));
const MINK = 0.05, MAXK = 128, PEN_GRACE = 700, PALM_SIZE = 40;

/* ================= 状態 ================= */
const S = {
  W: 1600, H: 1200, bg: '#ffffff', bgT: false,
  tool: 'pen', color: '#1a1a1a', opacity: 100, smooth: 20,
  size: { pen: 4, eraser: 24 }, tol: 32, fillRef: 'all', lassoAll: false,
  palm: true, penSeen: false, view: { x: 0, y: 0, k: 1 }
};
let layers = [], activeId = null, layerSeq = 0;
let sel = null;            // {els:[], bb:[]}
let D = null;              // 現在の描画操作
let G = null;              // ピンチジェスチャ
const pointers = new Map();
let lastPen = -1e9, penDown = false, spaceDown = false;

/* ================= SVG 構造 ================= */
const vp = $('#vp');
const svg = el('svg', {}, vp);
vp.insertBefore(svg, vp.firstChild);
const defs = el('defs', {}, svg);
const clip = el('clipPath', { id: 'pageclip' }, defs);
const clipRect = el('rect', {}, clip);
const pat = el('pattern', { id: 'checker', patternUnits: 'userSpaceOnUse', width: 32, height: 32 }, defs);
el('rect', { width: 32, height: 32, fill: '#fff' }, pat);
el('rect', { width: 16, height: 16, fill: '#d4d4d8' }, pat);
el('rect', { x: 16, y: 16, width: 16, height: 16, fill: '#d4d4d8' }, pat);
const world = el('g', {}, svg);
const pageBg = el('rect', {}, world);
const layersClip = el('g', { 'clip-path': 'url(#pageclip)' }, world);
const layersG = el('g', {}, layersClip);
const pageBorder = el('rect', { fill: 'none', stroke: '#888', 'stroke-width': 1, 'vector-effect': 'non-scaling-stroke' }, world);
const overlay = el('g', { 'pointer-events': 'none' }, world);
const selG = el('g', {}, overlay);

function updatePage() {
  for (const r of [clipRect, pageBg, pageBorder]) { r.setAttribute('width', S.W); r.setAttribute('height', S.H); }
  pageBg.setAttribute('fill', S.bgT ? 'url(#checker)' : S.bg);
}
function applyView() {
  const v = S.view;
  world.setAttribute('transform', `translate(${v.x} ${v.y}) scale(${v.k})`);
  $('#bZoom').textContent = Math.round(v.k * 100) + '%';
  drawSel(); updateCursorSize();
}
function toWorld(cx, cy) { const r = vp.getBoundingClientRect(); return [(cx - r.left - S.view.x) / S.view.k, (cy - r.top - S.view.y) / S.view.k]; }
function zoomAt(cx, cy, f) {
  const v = S.view, k = clamp(v.k * f, MINK, MAXK), wx = (cx - v.x) / v.k, wy = (cy - v.y) / v.k;
  v.k = k; v.x = cx - wx * k; v.y = cy - wy * k; applyView();
}
function fit() {
  const r = vp.getBoundingClientRect(); if (!r.width) return;
  const k = clamp(Math.min((r.width - 40) / S.W, (r.height - 40) / S.H), MINK, 1);
  S.view.k = k; S.view.x = (r.width - S.W * k) / 2; S.view.y = (r.height - S.H * k) / 2; applyView();
}

/* ================= 数学ヘルパー ================= */
const mmul = (a, b) => [a[0]*b[0]+a[2]*b[1], a[1]*b[0]+a[3]*b[1], a[0]*b[2]+a[2]*b[3], a[1]*b[2]+a[3]*b[3], a[0]*b[4]+a[2]*b[5]+a[4], a[1]*b[4]+a[3]*b[5]+a[5]];
const minv = m => { const d = m[0]*m[3]-m[1]*m[2]; return [m[3]/d, -m[1]/d, -m[2]/d, m[0]/d, (m[2]*m[5]-m[3]*m[4])/d, (m[1]*m[4]-m[0]*m[5])/d]; };
const mapply = (m, x, y) => [m[0]*x+m[2]*y+m[4], m[1]*x+m[3]*y+m[5]];
function getM(e) {
  const t = e.getAttribute('transform'); if (!t) return [1,0,0,1,0,0];
  const n = t.match(/-?\d*\.?\d+(?:e[-+]?\d+)?/gi); return n && n.length >= 6 ? n.slice(0, 6).map(Number) : [1,0,0,1,0,0];
}
function setM(e, m) { e.setAttribute('transform', `matrix(${m.map(v => +v.toFixed(6)).join(' ')})`); }
function inLoop(P, x, y) {
  let c = false; const n = P.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = P[2*i], yi = P[2*i+1], xj = P[2*j], yj = P[2*j+1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function segDist2(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L = dx*dx + dy*dy;
  let t = L ? ((px - x1) * dx + (py - y1) * dy) / L : 0; t = clamp(t, 0, 1);
  const ex = px - (x1 + t*dx), ey = py - (y1 + t*dy); return ex*ex + ey*ey;
}
function rdp(P, eps) {
  const n = P.length / 2; if (n < 3 || eps <= 0) return P;
  const keep = new Uint8Array(n); keep[0] = keep[n-1] = 1;
  const st = [0, n - 1];
  while (st.length) {
    const j = st.pop(), i = st.pop();
    let md = 0, mi = -1;
    for (let k = i + 1; k < j; k++) {
      const d = segDist2(P[2*k], P[2*k+1], P[2*i], P[2*i+1], P[2*j], P[2*j+1]);
      if (d > md) { md = d; mi = k; }
    }
    if (mi >= 0 && md > eps * eps) { keep[mi] = 1; st.push(i, mi, mi, j); }
  }
  const out = []; for (let k = 0; k < n; k++) if (keep[k]) out.push(P[2*k], P[2*k+1]); return out;
}
function rdpClosed(P, eps) {
  const n = P.length / 2; if (n < 5 || eps <= 0) return P;
  let f = 1, md = -1;
  for (let k = 1; k < n; k++) { const d = (P[2*k]-P[0])**2 + (P[2*k+1]-P[1])**2; if (d > md) { md = d; f = k; } }
  const a = rdp(P.slice(0, 2*f + 2), eps);
  const b = rdp(P.slice(2*f).concat([P[0], P[1]]), eps);
  return a.concat(b.slice(2, -2));
}

/* ================= パス生成 ================= */
function strokeD(P, prec) {
  const n = P.length / 2, f = v => fmt(v, prec);

        for (let i = 0; i < 8; i++) { const mid = (lo + hi) / 2; sInfo.textContent = `圧縮中… (縮小率 ${Math.round(mid * 100)}%)`; await tick(); const t = await enc(mid, q); if (t.blob.size <= o.target) { lo = mid; best = t; } else hi = mid; }
        r = best; ok = true; note = `解像度を縮小（${r.w}×${r.h}）`;
      } else r = smallest;
    }
  }
  download(r.blob, o.name + (o.fmt === 'png' ? '.png' : '.jpg'));
  sInfo.textContent = `保存しました: ${fmtBytes(r.blob.size)}（${r.w}×${r.h}px）` + (o.comp ? (ok ? (note ? ' ' + note : '（圧縮不要）') : `／目標 ${fmtBytes(o.target)} には届きませんでした`) : '');
}
$('#sGo').onclick = async () => {
  const o = sOpts(); $('#sGo').disabled = true; sInfo.textContent = '処理中…'; await tick();
  try { await (o.fmt === 'svg' ? saveSVG(o) : saveRaster(o)); }
  catch (err) { console.error(err); sInfo.textContent = '保存に失敗しました: ' + err.message; }
  finally { $('#sGo').disabled = false; }
};

/* ================= 起動 ================= */
(function init() {
  let s = null; try { s = JSON.parse(localStorage.getItem('svgdraw.v1') || 'null'); } catch (e) {}
  if (s && s.layers && s.layers.length) { try { restore(s); } catch (e) { s = null; } }
  if (!s) { const L = newLayer(); layers.push(L); activeId = L.id; syncLayersDOM(); updatePage(); renderLayers(); }
  hist.stack = [snapshot()]; hist.idx = 0; updateHistBtns();
  setColor(S.color); setTool('pen'); setPalm(true); $('#toast').classList.remove('show');
  new ResizeObserver(() => { if (!init.done) { init.done = true; fit(); } }).observe(vp);
  fit();
})();
})();
</script>
